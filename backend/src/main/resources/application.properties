spring.config.import=optional:file:./src/main/resources/application-secrets.properties

spring.application.name=backend

# Banco de Dados MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fincontrol}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta do servidor
server.port=${PORT:8080}

# Configurações de JWT
jwt.secret=${JWT_SECRET:string_de_pelo_menos_32_caracteres}
jwt.expiration=86400000

# Configuração de envio de e-mail
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:seu-email-real@gmail.com}}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:seu-email-real@gmail.com}
spring.mail.password=${MAIL_PASSWORD:sua-senha-de-app-de-16-digitos}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Cloudflare Turnstile
turnstile.secret-key=${TURNSTILE_SECRET_KEY:}

# URL do frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Origens permitidas pelo CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Integração com Google Gemini
gemini.api-key=${GOOGLE_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:1200}